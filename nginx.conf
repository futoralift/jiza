# ======================================================
# JIZA JEWELLERY STUDIO — NGINX REVERSE PROXY CONFIG
# Production Hostinger KVM VPS Configuration
# ======================================================

# Upstream pool with keepalive to reuse Express connections under load
upstream jiza_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name jizajewellery.com www.jizajewellery.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jizajewellery.com www.jizajewellery.com;

    # SSL Certificate Paths (Managed via Certbot Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/jizajewellery.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jizajewellery.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Connection tuning for sustained concurrency
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_buffers 16 8k;

    # Frontend Single Page Application (Vite Dist Bundle)
    root /var/www/jiza-jewellery-studio/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching Optimization (Images, Styles, Scripts, Fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options nosniff;
        add_header Vary Accept-Encoding;
    }

    # Static Uploads Media Proxy / Direct Serve
    location /uploads/ {
        alias /var/www/jiza-jewellery-studio/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options nosniff;
        add_header Vary Accept-Encoding;
    }

    # Backend Express REST API Reverse Proxy
    location /api/ {
        proxy_pass http://jiza_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
        proxy_send_timeout 30;
        client_max_body_size 20M;
    }
}
